# arquitetura.arcanestudios.io (site de demonstração). Projeto Docker "arquitetura" na VPS.
# A cada subida: o serviço "carga" baixa o site deste repositório (funciona privado ou público: usa o GH_TOKEN do projeto auto-deploy, lido só para leitura) para o volume; o "web" (nginx) serve.
services:
  carga:
    image: alpine:3.20
    restart: "no"
    volumes:
      - site:/site
      - /docker/auto-deploy/.env:/auto-deploy.env:ro
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache curl >/dev/null
        rm -rf /tmp/src && mkdir /tmp/src
        GH=$$(grep -E '^GH_TOKEN=' /auto-deploy.env 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
        U=https://codeload.github.com/ArcaneStudioss/arquitetura/tar.gz/refs/heads/main
        if [ -n "$$GH" ]; then curl -fsSL -H "Authorization: Bearer $$GH" "$$U"; else curl -fsSL "$$U"; fi | tar xz --strip-components=1 -C /tmp/src
        [ -f /tmp/src/index.html ] || { echo pacote-invalido; exit 1; }
        rm -rf /site/* /site/.[!.]* 2>/dev/null || true
        cd /tmp/src && cp -a index.html favicon.svg robots.txt css js fonts img /site/
        chmod -R a+rX /site
        echo "carga ok: $$(find /site -type f | wc -l) arquivos"
  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      carga: { condition: service_completed_successfully }
    volumes: [site:/usr/share/nginx/html:ro]
    configs:
      - { source: nginx_conf, target: /etc/nginx/conf.d/default.conf }
    labels:
      - traefik.enable=true
      - traefik.http.routers.arc-arquitetura.rule=Host(`arquitetura.arcanestudios.io`)
      - traefik.http.routers.arc-arquitetura.entrypoints=websecure
      - traefik.http.routers.arc-arquitetura.tls.certresolver=letsencrypt
      - traefik.http.services.arc-arquitetura.loadbalancer.server.port=80

configs:
  nginx_conf:
    content: |
      server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;
        gzip on; gzip_types text/css application/javascript image/svg+xml;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
        location ~* \.(css|js)$$ { add_header Cache-Control "public, max-age=604800" always; add_header X-Content-Type-Options nosniff always; }
        location ~* \.(webp|svg|woff2)$$ { add_header Cache-Control "public, max-age=2592000" always; add_header X-Content-Type-Options nosniff always; }
        location / { try_files $$uri $$uri/ =404; }
        location ~ /\. { deny all; }
      }

volumes:
  site: { name: arc_arquitetura }
